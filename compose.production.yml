# Production compose for the TreePulse landing page.
# Runs as a completely separate container — it does NOT touch the existing
# admin dashboard. TREEPULSE_IMAGE is set by deploy/deploy.sh to an immutable
# ghcr.io/cyizere-happy/treepulse_landing_page:sha-<commit> tag.

services:
  treepulse-landing:
    image: ${TREEPULSE_IMAGE}
    container_name: treepulse-landing
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
