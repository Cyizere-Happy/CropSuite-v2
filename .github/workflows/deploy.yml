name: Deploy

on:
  push:
    branches: [main]

# Least privilege: read the repo, publish packages to GHCR. Nothing else.
permissions:
  contents: read
  packages: write

# Never run two production deployments at once; queue instead of cancelling.
concurrency:
  group: treepulse-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/cyizere-happy/treepulse_landing_page
  NODE_VERSION: "22"

jobs:
  # ---- same gate as CI, before anything is published or deployed -----------
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm run type-check

  # ---- build the production image and push it to GHCR ---------------------
  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      tag: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_ANDROID_APK_URL=${{ vars.NEXT_PUBLIC_ANDROID_APK_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---- deploy the immutable SHA image to the server ----------------------
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure deploy SSH key + known_hosts
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Trigger server-side deployment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/deploy_key" \
              -o IdentitiesOnly=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 \
              -p "$DEPLOY_PORT" \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "deploy sha-${GITHUB_SHA}"

      - name: Remove deploy key
        if: always()
        run: rm -f "$HOME/.ssh/deploy_key"

      - name: Report
        if: success()
        run: |
          {
            echo "### TreePulse landing page deployed"
            echo ""
            echo "- Image: \`${IMAGE}:sha-${GITHUB_SHA}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- URL: http://41.186.188.96:3001"
          } >> "$GITHUB_STEP_SUMMARY"
